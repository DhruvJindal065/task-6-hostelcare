<body><header class="header"><nav class="navbar container"><a href="index.html" class="logo">Hostel<span>Care</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="complaint.html">Complaint</a></li><li><a class="nav-btn active-btn" href="signup.html">Sign Up</a></li></ul></nav></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">JOIN HOSTELCARE</p><h1>Create your student account</h1><p>Enter your details to get started.</p></div></section><section class="section"><div class="container narrow-container"><form class="form-card" onsubmit="event.preventDefault(); document.getElementById('signup-status').textContent='Your sign-up details have been entered. This demo website does not yet save accounts.';"><label for="student-name">Full Name</label><input id="student-name" name="name" type="text" placeholder="Enter your full name" required><label for="student-email">Email Address</label><input id="student-email" name="email" type="email" placeholder="Enter your email address" required><label for="student-id">Student / Roll Number</label><input id="student-id" name="student-id" type="text" placeholder="Enter your student ID" required><label for="signup-room">Hostel Room Number</label><input id="signup-room" name="room" type="text" placeholder="Enter your room number" required><label for="signup-password">Create Password</label><input id="signup-password" name="password" type="password" minlength="6" placeholder="Create a password (minimum 6 characters)" required><button class="btn primary" type="submit">Create Account</button><p class="form-status" id="signup-status" role="status"></p><p class="muted form-note">Already have an account? <a href="login.html">Login here</a>.</p></form></div></section></main>
