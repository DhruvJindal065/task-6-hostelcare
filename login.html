<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HostelCare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 110px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #111827; }
    .logo span { color: #2563eb; }
    nav { display: flex; align-items: center; gap: 32px; }
    nav a { text-decoration: none; color: #4b5563; font-size: 18px; font-weight: 600; }
    nav a.login { background: #2563eb; color: #fff; padding: 12px 26px; border-radius: 8px; }
    main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 60px 20px; }
    .card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      padding: 44px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    .brand { color: #2563eb; font-weight: 800; letter-spacing: 2px; font-size: 14px; margin-bottom: 20px; }
    h1 { font-size: 34px; margin-bottom: 10px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; margin-top: 20px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 70px; }
    .show-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2563eb;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    .login-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-btn:hover { background: #1d4ed8; }
    #status {
      margin-top: 20px;
      padding: 16px;
      background: #eef4ff;
      color: #1e40af;
      border-radius: 8px;
      font-weight: 600;
    }
    .back { display: block; text-align: center; margin-top: 24px; color: #2563eb; text-decoration: none; font-weight: 600; }
    footer {
      background: #111827;
      color: #d1d5db;
      padding: 40px 110px;
      text-align: center;
      font-size: 14px;
    }
    footer .logo { color: #fff; margin-bottom: 10px; font-size: 24px; }
    footer .logo span { color: #60a5fa; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Hostel<span>Care</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="complaint.html">Register Complaint</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="login">Login</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="icon">🏠</div>
      <div class="brand">HOSTELCARE</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Login to access the hostel service portal.</p>

      <form id="loginForm">
        <label for="username">Email / Username</label>
        <input id="username" type="text" required>

        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" required>
          <button type="button" class="show-btn" id="toggleBtn">Show</button>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div id="status" hidden>
        You have been logged in to your account.
      </div>

      <a href="index.html" class="back">← Back to Home</a>
    </div>
  </main>

  <footer>
    <div class="logo">Hostel<span>Care</span></div>
    <p>&copy; 2026 HostelCare. Student hostel services project.</p>
  </footer>

  <script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");
    const password = document.getElementById("password");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.addEventListener("click", () => {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggleBtn.textContent = showing ? "Show" : "Hide";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      status.hidden = false;
    });
  </script>

</body>
</html>
