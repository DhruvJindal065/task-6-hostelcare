<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | HostelCare</title><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><nav class="navbar container"><a href="index.html" class="logo">Hostel<span>Care</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a class="nav-btn active-btn" href="login.html">Login</a></li></ul></nav></header>

<p class="form-status" id="login-status" hidden></p>
</form>
