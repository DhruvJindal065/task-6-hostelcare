<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Raise a Complaint | HostelCare</title><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><nav class="navbar container"><a href="index.html" class="logo">Hostel<span>Care</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a class="nav-btn active-btn" href="complaint.html">Complaint</a></li><li><a href="signup.html">Sign Up</a></li></ul></nav></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">STUDENT SUPPORT</p><h1>Raise a hostel complaint</h1><p>Tell us about the issue and where it is happening.</p></div></section><section class="section"><div class="container narrow-container"><form class="form-card" onsubmit="event.preventDefault(); document.getElementById('complaint-status').textContent='Your complaint has been filled in. This demo website does not yet send or store complaints.';"><label for="complaint-name">Your Name</label><input id="complaint-name" name="name" type="text" placeholder="Enter your name" required><label for="complaint-email">Email Address</label><input id="complaint-email" name="email" type="email" placeholder="Enter your email address" required><label for="complaint-room">Room Number / Location</label><input id="complaint-room" name="room" type="text" placeholder="Enter room number or location" required><label for="complaint-category">Complaint Category</label><select id="complaint-category" name="category" required><option value="" disabled selected>Select a category</option><option>Plumbing</option><option>Electricity</option><option>Internet / Wi-Fi</option><option>Cleanliness</option><option>Room / Furniture</option><option>Other</option></select><label for="complaint-details">Complaint Details</label><textarea id="complaint-details" name="details" rows="5" placeholder="Describe the issue clearly" required></textarea><button class="btn primary" type="submit">Submit Complaint</button><p class="form-status" id="complaint-status" role="status"></p></form></div></section></main>
