<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise a Complaint | HostelCare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 24px; font-weight: bold; color: #111827; }
    .logo span { color: #2563eb; }
    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #4b5563;
      font-weight: 600;
    }
    nav a.active { color: #2563eb; }
    nav a.login {
      background: #2563eb;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
    }
    main { flex: 1; display: flex; justify-content: center; padding: 48px 20px; }
    .card {
      background: #fff;
      width: 100%;
      max-width: 720px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; margin-top: 20px; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    textarea { resize: vertical; }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      padding: 14px;
      background: #e8f7ec;
      color: #1e6b34;
      border-radius: 8px;
      font-weight: 600;
    }
    footer {
      background: #111827;
      color: #d1d5db;
      padding: 32px 40px;
      text-align: center;
      font-size: 14px;
    }
    footer .logo { color: #fff; margin-bottom: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Hostel<span>Care</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="complaint.html" class="active">Register Complaint</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="login">Login</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Raise a Complaint</h1>
      <p class="subtitle">Tell us about the issue in your hostel room or block.</p>

      <form id="complaintForm">
        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="room">Room Number / Location</label>
        <input id="room" type="text" required>

        <label for="category">Complaint Category</label>
        <select id="category" required>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Internet">Internet</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Other">Other</option>
        </select>

        <label for="details">Complaint Details</label>
        <textarea id="details" rows="6" required></textarea>

        <button type="submit" id="submitBtn">Submit Complaint</button>
      </form>

      <div id="status" hidden>
        Your complaint has been sent to the authority of management.
      </div>
    </div>
  </main>

  <footer>
    <div class="logo">Hostel<span>Care</span></div>
    <p>&copy; 2026 HostelCare. Student hostel services project.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const db = getFirestore(initializeApp({
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project",
      appId: "YOUR_APP_ID"
    }));

    const form = document.getElementById("complaintForm");
    const status = document.getElementById("status");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.disabled = true;
      button.textContent = "Submitting...";
      try {
        await addDoc(collection(db, "complaints"), {
          email: document.getElementById("email").value,
          room: document.getElementById("room").value,
          category: document.getElementById("category").value,
          details: document.getElementById("details").value,
          createdAt: serverTimestamp()
        });
        status.hidden = false;
        form.reset();
      } catch (err) {
        alert("Could not send your complaint. Please try again.");
        console.error(err);
      } finally {
        button.disabled = false;
        button.textContent = "Submit Complaint";
      }
    });
  </script>

</body>
</html>
