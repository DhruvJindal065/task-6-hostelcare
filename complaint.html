```html
<form id="complaintForm">
  <label for="email"><b>Email</b></label>
  <input id="email" type="email" required>

  <label for="room"><b>Room Number / Location</b></label>
  <input id="room" type="text" required>

  <label for="category"><b>Complaint Category</b></label>
  <select id="category" required>
    <option value="Electricity">Electricity</option>
    <option value="Water">Water</option>
    <option value="Internet">Internet</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Other">Other</option>
  </select>

  <label for="details"><b>Complaint Details</b></label>
  <textarea id="details" rows="6" required></textarea>

  <button type="submit" id="submitBtn">Submit Complaint</button>
</form>

<div id="status" hidden style="margin-top:16px; padding:12px; background:#e8f7ec; color:#1e6b34; border-radius:8px;">
  Your complaint is saved and sent to the team.
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const db = getFirestore(initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    appId: "YOUR_APP_ID"
  }));

  const form = document.getElementById("complaintForm");
  const status = document.getElementById("status");
  const button = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    button.disabled = true;
    button.textContent = "Submitting...";
    try {
      await addDoc(collection(db, "complaints"), {
        email: document.getElementById("email").value,
        room: document.getElementById("room").value,
        category: document.getElementById("category").value,
        details: document.getElementById("details").value,
        createdAt: serverTimestamp()
      });
      status.hidden = false;
      form.reset();
    } catch (err) {
      alert("Could not send your complaint. Please try again.");
      console.error(err);
    } finally {
      button.disabled = false;
      button.textContent = "Submit Complaint";
    }
  }); 
```
