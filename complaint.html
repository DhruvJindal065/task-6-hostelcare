<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise a Complaint | HostelCare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 110px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #111827; }
    .logo span { color: #2563eb; }
    nav { display: flex; align-items: center; gap: 32px; }
    nav a { text-decoration: none; color: #4b5563; font-size: 18px; font-weight: 600; }
    nav a.active { color: #2563eb; }
    nav a.login { background: #2563eb; color: #fff; padding: 12px 26px; border-radius: 8px; }
    main { flex: 1; padding: 48px 20px; }
    .card {
      background: #fff;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { font-size: 30px; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-bottom: 24px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; margin-top: 22px; }
    input, select, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 17px;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    textarea { resize: vertical; min-height: 160px; }
    button[type="submit"] {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #1d4ed8; }
    #status {
      margin-top: 20px;
      padding: 16px;
      background: #e8f7ec;
      color: #1e6b34;
      border-radius: 8px;
      font-weight: 600;
    }
    footer {
      background: #111827;
      color: #d1d5db;
      padding: 40px 110px;
      text-align: center;
      font-size: 14px;
    }
    footer .logo { color: #fff; margin-bottom: 10px; font-size: 24px; }
    footer .logo span { color: #60a5fa; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Hostel<span>Care</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="complaint.html" class="active">Register Complaint</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="login">Login</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Raise a Complaint</h1>
      <p class="subtitle">Tell us about the issue in your hostel room or block.</p>

      <form id="complaintForm">
        <label for="name">Name</label>
        <input id="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="room">Room Number / Location</label>
        <input id="room" type="text" required>

        <label for="category">Complaint Category</label>
        <select id="category" required>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
          <option value="Internet / Wi-Fi">Internet / Wi-Fi</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Other">Other</option>
        </select>

        <label for="details">Complaint Details</label>
        <textarea id="details" required></textarea>

        <button type="submit">Submit Complaint</button>
      </form>

      <div id="status" hidden>
        Your complaint has been registered and sent to the management.
      </div>
    </div>
  </main>

  <footer>
    <div class="logo">Hostel<span>Care</span></div>
    <p>&copy; 2026 HostelCare. Student hostel services project.</p>
  </footer>

  <script>
    const form = document.getElementById("complaintForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      status.hidden = false;
      form.reset();
    });
  </script>

</body>
</html>
